<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro da Turma</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro5.css') }}">
</head>
<body>

    <div class="container">

        <h1>Cadastro da Turma</h1>

        <div class="formulario">

            <input type="text" id="nome" placeholder="Digite o nome">

            <input type="number" id="idade" placeholder="Digite a idade">

            <select id="curso">
                <option value="">Selecione um curso/interesse</option>
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Banco de Dados">Banco de Dados</option>
                <option value="Front-end">Front-end</option>
                <option value="Back-end">Back-end</option>
            </select>

            <div class="botoes">
                <button id="btnCadastrar">Cadastrar</button>
                <button id="btnLimpar">Limpar Lista</button>
            </div>

        </div>

        <div class="contador">
            Total cadastrados: <span id="contador">0</span>
        </div>

        <div id="listaCards" class="lista-cards"></div>

    </div>

    <script src="{{ url_for('static', filename='js/cadastro5.js') }}"></script>
</body>
</html>
